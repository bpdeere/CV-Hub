<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projected AVA Calculator</title>
    <style>
        :root {
            --primary: #0056b3;
            --background: #f4f7f6;
            --surface: #ffffff;
            --text: #333333;
            --border: #cccccc;
            --danger: #d9534f;
            --success: #5cb85c;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 16px;
            line-height: 1.5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--surface);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1, h2, h3 {
            color: var(--primary);
            text-align: center;
        }
        h1 { font-size: 1.5rem; }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .section-box {
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            background: #fafafa;
        }
        .results-panel {
            background: #e9f2fb;
            border: 2px solid var(--primary);
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            margin-top: 24px;
        }
        .results-panel span {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
        }
        .warning {
            color: var(--danger);
            font-weight: bold;
            display: none;
            text-align: center;
            margin-top: 10px;
        }
        .intermediate-results {
            font-size: 0.85rem;
            color: #555;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
        }
        canvas {
            width: 100%;
            max-width: 100%;
            height: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            margin-top: 20px;
        }
    </style>
</head>
<nav style="background: #f8f9fa; border-bottom: 1px solid #dee2e6; padding: 10px 24px; display: flex; gap: 20px;">
  <a href="index.html" style="color: #0056b3; text-decoration: none; font-size: 13px; font-weight: 600;">Projected AVA</a>
  <a href="exercise.html" style="color: #6c757d; text-decoration: none; font-size: 13px; font-weight: 500;">Exercise Capacity</a>
  <a href="ASNC_PET_MPI_Reporting_Tables_Reference (1).html" style="color: #6c757d; text-decoration: none; font-size: 13px; font-weight: 500;">Nuclear Reporting Tables</a>
  <a href="cardio-hub-interactive-readme_1.html" style="color: #38bdf8; text-decoration: none; font-size: 13px; font-weight: 600;">Cardio Hub</a>  
</nav>    
<body>

<div class="container">
    <h1>Projected AVA Calculator</h1>
    <p style="text-align: center; font-size: 0.85rem; color: #666;">Standardized to 250 mL/s Flow Rate</p>

    <div class="section-box">
        <div class="input-group">
            <label for="lvotDiameter">LVOT Diameter (cm)</label>
            <input type="number" id="lvotDiameter" step="0.1" value="2.0">
        </div>
    </div>

    <div class="section-box">
        <h2>Resting Parameters</h2>
        <div class="input-group">
            <label for="restLvotVti">Rest LVOT VTI (cm)</label>
            <input type="number" id="restLvotVti" step="0.1" value="15.0">
        </div>
        <div class="input-group">
            <label for="restAvVti">Rest AV VTI (cm)</label>
            <input type="number" id="restAvVti" step="0.1" value="50.0">
        </div>
        <div class="input-group">
            <label for="restEt">Rest Ejection Time (ms)</label>
            <input type="number" id="restEt" step="1" value="320">
        </div>
        <div class="intermediate-results" id="restIntermediate">
            </div>
    </div>

    <div class="section-box">
        <h2>Peak Stress Parameters</h2>
        <div class="input-group">
            <label for="peakLvotVti">Peak LVOT VTI (cm)</label>
            <input type="number" id="peakLvotVti" step="0.1" value="22.0">
        </div>
        <div class="input-group">
            <label for="peakAvVti">Peak AV VTI (cm)</label>
            <input type="number" id="peakAvVti" step="0.1" value="65.0">
        </div>
        <div class="input-group">
            <label for="peakEt">Peak Ejection Time (ms)</label>
            <input type="number" id="peakEt" step="1" value="280">
        </div>
        <div class="intermediate-results" id="peakIntermediate">
            </div>
    </div>

    <div class="results-panel" id="resultsPanel">
        <h3>Projected AVA (cm²)</h3>
        <span id="projAvaResult">--</span>
    </div>
    <div class="warning" id="warningMsg">
        Flow reserve must be positive (Q_peak > Q_rest) to project AVA.
    </div>

    <canvas id="graphCanvas" width="500" height="300"></canvas>
</div>

<script>
    const inputs = document.querySelectorAll('input');
    const projAvaResult = document.getElementById('projAvaResult');
    const resultsPanel = document.getElementById('resultsPanel');
    const warningMsg = document.getElementById('warningMsg');
    const restIntermediate = document.getElementById('restIntermediate');
    const peakIntermediate = document.getElementById('peakIntermediate');
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');

    function calculate() {
        const lvotD = parseFloat(document.getElementById('lvotDiameter').value);
        
        const rLvotVti = parseFloat(document.getElementById('restLvotVti').value);
        const rAvVti = parseFloat(document.getElementById('restAvVti').value);
        const rEt = parseFloat(document.getElementById('restEt').value);
        
        const pLvotVti = parseFloat(document.getElementById('peakLvotVti').value);
        const pAvVti = parseFloat(document.getElementById('peakAvVti').value);
        const pEt = parseFloat(document.getElementById('peakEt').value);

        if ([lvotD, rLvotVti, rAvVti, rEt, pLvotVti, pAvVti, pEt].some(isNaN)) return;

        const lvotArea = Math.PI * Math.pow(lvotD / 2, 2);

        // Rest Calculations
        const rSv = lvotArea * rLvotVti;
        const rQ = rSv / (rEt / 1000);
        const rAva = rSv / rAvVti;

        // Peak Calculations
        const pSv = lvotArea * pLvotVti;
        const pQ = pSv / (pEt / 1000);
        const pAva = pSv / pAvVti;

        // Update Intermediate Text
        restIntermediate.innerHTML = `<span>SV: ${rSv.toFixed(1)} mL</span> <span>Q: ${rQ.toFixed(1)} mL/s</span> <span>AVA: ${rAva.toFixed(2)} cm²</span>`;
        peakIntermediate.innerHTML = `<span>SV: ${pSv.toFixed(1)} mL</span> <span>Q: ${pQ.toFixed(1)} mL/s</span> <span>AVA: ${pAva.toFixed(2)} cm²</span>`;

        // Calculate Projected
        if (pQ <= rQ) {
            resultsPanel.style.display = 'none';
            warningMsg.style.display = 'block';
            drawGraph(null, null, null, null, null);
        } else {
            resultsPanel.style.display = 'block';
            warningMsg.style.display = 'none';
            
            const projAva = rAva + ((pAva - rAva) / (pQ - rQ)) * (250 - rQ);
            projAvaResult.innerText = projAva.toFixed(2);
            drawGraph(rQ, rAva, pQ, pAva, projAva);
        }
    }

    function drawGraph(rQ, rAva, pQ, pAva, projAva) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Margins and plotting area
        const padding = 40;
        const width = canvas.width - padding * 2;
        const height = canvas.height - padding * 2;

        // Draw Axes
        ctx.beginPath();
        ctx.strokeStyle = '#ccc';
        ctx.moveTo(padding, padding);
        ctx.lineTo(padding, canvas.height - padding);
        ctx.lineTo(canvas.width - padding, canvas.height - padding);
        ctx.stroke();

        // Labels
        ctx.fillStyle = '#666';
        ctx.font = '12px sans-serif';
        ctx.fillText('Flow Rate (mL/s)', canvas.width / 2 - 40, canvas.height - 10);
        
        ctx.save();
        ctx.translate(15, canvas.height / 2 + 30);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText('AVA (cm²)', 0, 0);
        ctx.restore();

        if (rQ === null) return; // Exit if no data to draw

        // Mapping functions
        const maxQ = Math.max(300, pQ + 20);
        const minQ = Math.max(0, rQ - 50);
        const maxAva = Math.max(2.0, projAva + 0.2, pAva + 0.2);
        
        const mapX = (q) => padding + ((q - minQ) / (maxQ - minQ)) * width;
        const mapY = (ava) => canvas.height - padding - (ava / maxAva) * height;

        // Draw Target Line at 250 mL/s
        const x250 = mapX(250);
        ctx.beginPath();
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = 'rgba(0, 128, 0, 0.5)';
        ctx.moveTo(x250, padding);
        ctx.lineTo(x250, canvas.height - padding);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'green';
        ctx.fillText('250 mL/s Target', x250 - 40, padding - 10);

        // Draw Extrapolation Line
        ctx.beginPath();
        ctx.strokeStyle = '#0056b3';
        ctx.lineWidth = 2;
        ctx.moveTo(mapX(rQ), mapY(rAva));
        ctx.lineTo(mapX(250), mapY(projAva));
        ctx.stroke();

        // Draw Points
        function drawPoint(x, y, color, label) {
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.stroke();
            ctx.fillStyle = '#333';
            ctx.fillText(label, x + 10, y - 10);
        }

        drawPoint(mapX(rQ), mapY(rAva), '#666', 'Rest');
        drawPoint(mapX(pQ), mapY(pAva), '#e67e22', 'Peak');
        drawPoint(mapX(250), mapY(projAva), '#d9534f', 'Proj');
    }

    // Attach event listeners to all inputs
    inputs.forEach(input => {
        input.addEventListener('input', calculate);
    });

    // Initial calculation on load
    calculate();
</script>
</body>
</html>
